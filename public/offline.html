<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garfado — Sem conexão</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #f5f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem;
      text-align: center;
    }
    .container { max-width: 280px; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
    .icon { font-size: 64px; }
    h1 { font-family: Georgia, serif; font-size: 1.5rem; font-weight: 700; }
    p { font-size: 0.875rem; color: #71717a; line-height: 1.6; }
    button {
      background: #4ade80;
      color: #0f1117;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🍴</div>
    <h1>Sem conexão</h1>
    <p>Parece que você está offline. Verifique sua internet e tente novamente.</p>
    <button onclick="window.location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
